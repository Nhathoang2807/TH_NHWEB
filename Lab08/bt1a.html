<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 1a - Máy tính nhanh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input[type="number"] {
            width: 60px;
            margin-right: 10px;
        }
        button {
            width: 40px;
            height: 30px;
            margin: 5px;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <p>Bài tập 1a</p>
    
    <label>A = </label>
    <input type="number" id="a" value="6">
    
    <label>B = </label>
    <input type="number" id="b" value="5">
    <br><br>
    
    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">-</button>
    <button onclick="calculate('*')">×</button>
    <button onclick="calculate('/')">÷</button>
    
    <div class="result" id="result">Kết quả: </div>

    <script>
        function calculate(operator) {
            const a = parseFloat(document.getElementById('a').value);
            const b = parseFloat(document.getElementById('b').value);
            let result;

            switch(operator) {
                case '+':
                    result = a + b;
                    break;
                case '-':
                    result = a - b;
                    break;
                case '*':
                    result = a * b;
                    break;
                case '/':
                    result = b !== 0 ? (a / b).toFixed(2) : 'Không chia cho 0';
                    break;
            }

            document.getElementById('result').textContent = "Kết quả: " + result;
        }
    </script>
</body>
</html>
