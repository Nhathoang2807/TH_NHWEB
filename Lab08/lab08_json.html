<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>User Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .user-card {
            width: 350px;
            border: 5px solid #000;
            padding: 20px;
            margin: 50px auto;
            border-radius: 5px;
        }
        .user-card h2 {
            text-align: center;
        }
        .user-card p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

<div class="user-card" id="userCard">
    <h2>User Information</h2>
    <strong>
        <p id="name"></p>
        <p id="age"></p>
        <p id="email"></p>
        <p id="address"></p>
    </strong>
    
</div>

<script>

    const user = {
        "name": "Nguyễn Văn A",
        "age": 30,
        "email": "nguyenvana@stu.edu.vn",
        "address": "Ho Chi Minh, NY 10001"
    };


    document.getElementById('name').textContent = "Name: " + user.name;
    document.getElementById('age').textContent = "Age: " + user.age;
    document.getElementById('email').textContent = "Email: " + user.email;
    document.getElementById('address').textContent = "Address: " + user.address;
</script>

</body>
</html>
