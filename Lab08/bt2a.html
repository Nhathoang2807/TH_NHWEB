<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 2a - Chuyển đổi tiền tệ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input[type="number"] {
            width: 100px;
            margin-right: 10px;
        }
        select {
            width: 60px;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h3>Bài tập 2a</h3>
    
    <label>Nhập tiền tệ: </label>
    <input type="number" id="amount" value="1" min="0">
    <select id="currency">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
    </select>
    <br><br>
    
    <div class="result" id="result">Thành tiền: 22000 VND</div>

    <script>

        const exchangeRates = {
            "USD": 22000,
            "EUR": 25000,
        };

        const amountInput = document.getElementById('amount');
        const currencySelect = document.getElementById('currency');
        const resultDiv = document.getElementById('result');

        function convert() {
            const amount = parseFloat(amountInput.value) || 0;
            const currency = currencySelect.value;
            const rate = exchangeRates[currency];
            const vnd = amount * rate;
            resultDiv.textContent = `Thành tiền: ${vnd.toLocaleString()} VND`;
        }
        amountInput.addEventListener('input', convert);
        currencySelect.addEventListener('change', convert);
        convert();
    </script>
</body>
</html>
